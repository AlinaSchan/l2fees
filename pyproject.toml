[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "l2fees"
version = "0.1.0"
description = "what a transaction costs right now on ethereum and thirteen rollups: execution gas and the layer-1 data fee of two real transactions, priced by each chain's own oracle. public rpcs, no keys."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alina Schanz" }]
keywords = ["ethereum", "layer2", "rollups", "gas", "fees", "optimism", "arbitrum", "base", "cli"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/AlinaSchan/l2fees"
Author = "https://alinaschanz.life"
Issues = "https://github.com/AlinaSchan/l2fees/issues"
Changelog = "https://github.com/AlinaSchan/l2fees/blob/main/CHANGELOG.md"

[project.scripts]
l2fees = "l2fees.cli:main"

[tool.setuptools]
packages = ["l2fees"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
